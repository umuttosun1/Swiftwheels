<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- <head> içeriği: <head th:replace="~{fragments/layout :: head('Başlık')}"></head> -->
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · SwiftWheels'">SwiftWheels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f7c83'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3ESW%3C/text%3E%3C/svg%3E">
</head>

<!-- Üst menü: active = 'home' | 'cars' | 'jeeps' | 'motors' | 'admin' | 'profile' -->
<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg navbar-dark sw-nav sticky-top">
  <div class="container">
    <a class="navbar-brand" th:href="@{/homepage}"><i class="bi bi-lightning-charge-fill"></i> SwiftWheels</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Menü">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto ms-lg-3 gap-lg-1">
        <li class="nav-item" th:each="t : ${vehicleTypes}">
          <a class="nav-link" th:classappend="${active == t.path} ? 'active'" th:href="@{'/' + ${t.path}}">
            <i th:class="'bi ' + ${t.icon}"></i> <span th:text="${t.plural}">Arabalar</span>
          </a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
          <a class="nav-link" th:classappend="${active == 'admin'} ? 'active'" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2"></i> Yönetim</a>
        </li>
      </ul>

      <form class="d-flex my-2 my-lg-0 me-lg-3" role="search" th:action="@{/search}" method="get">
        <input class="form-control form-control-sm" type="search" name="q" placeholder="Marka, model, renk…"
               th:value="${q}" aria-label="Ara">
      </form>

      <div sec:authorize="isAnonymous()" class="d-flex gap-2">
        <a class="btn btn-sm btn-light" th:href="@{/login}">Giriş yap</a>
        <a class="btn btn-sm btn-outline-light" th:href="@{/register}">Hesap aç</a>
      </div>

      <div sec:authorize="isAuthenticated()" class="dropdown">
        <a href="#" class="d-flex align-items-center gap-2 text-white text-decoration-none dropdown-toggle"
           data-bs-toggle="dropdown" aria-expanded="false">
          <span class="sw-avatar" th:text="${currentUser != null ? currentUser.firstName.substring(0,1) : '?'}">U</span>
          <span class="d-lg-none" th:text="${currentUser?.fullName}">Kullanıcı</span>
        </a>
        <ul class="dropdown-menu dropdown-menu-end shadow">
          <li class="px-3 py-2 small text-muted" th:if="${currentUser != null}">
            <div class="fw-semibold text-dark" th:text="${currentUser.fullName}">Ad Soyad</div>
            <div th:text="${currentUser.email}">mail</div>
          </li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person me-2"></i>Profilim ve kiralamalarım</a></li>
          <li sec:authorize="hasRole('ADMIN')"><a class="dropdown-item" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Yönetim paneli</a></li>
          <li><hr class="dropdown-divider"></li>
          <li>
            <form th:action="@{/logout}" method="post" class="m-0">
              <button class="dropdown-item text-danger" type="submit"><i class="bi bi-box-arrow-right me-2"></i>Çıkış yap</button>
            </form>
          </li>
        </ul>
      </div>
    </div>
  </div>
</nav>

<!-- Flash bildirimleri -->
<div th:fragment="flash" class="container mt-3">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2" role="alert">
    <i class="bi bi-check-circle-fill"></i><span th:text="${success}">Tamam</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Kapat"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2" role="alert">
    <i class="bi bi-exclamation-triangle-fill"></i><span th:text="${error}">Hata</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Kapat"></button>
  </div>
</div>

<!-- Araç kartı: vehicle = Vehicle -->
<div th:fragment="vehicleCard(vehicle)" class="sw-card vehicle-card d-flex flex-column">
  <a class="media" th:href="@{'/' + ${vehicle.vehicleType.path} + '/' + ${vehicle.id}}">
    <img th:if="${vehicle.hasImage()}" th:src="@{'/vehicles/' + ${vehicle.id} + '/image'}" th:alt="${vehicle.title}" loading="lazy">
    <i th:unless="${vehicle.hasImage()}" th:class="'bi ' + ${vehicle.vehicleType.icon}"></i>
  </a>
  <div class="p-3 d-flex flex-column flex-grow-1">
    <div class="d-flex justify-content-between align-items-start gap-2">
      <div class="title" th:text="${vehicle.title}">Marka Model</div>
      <span class="badge rounded-pill" th:classappend="${vehicle.stock > 0} ? 'badge-stock' : 'badge-out'"
            th:text="${vehicle.stock > 0} ? ${vehicle.stock} + ' müsait' : 'Stokta yok'">3 müsait</span>
    </div>
    <div class="meta mb-2">
      <span th:text="${vehicle.year}">2022</span> ·
      <span th:text="${#numbers.formatInteger(vehicle.km, 1, 'POINT')} + ' km'">18.500 km</span> ·
      <span th:text="${vehicle.color}">Gümüş</span>
    </div>
    <div class="mt-auto d-flex justify-content-between align-items-center">
      <div class="price"><span th:text="${#numbers.formatInteger(vehicle.price, 1, 'POINT')} + ' ₺'">1.200 ₺</span> <small>/ gün</small></div>
      <a class="btn btn-sm btn-outline-primary" th:href="@{'/' + ${vehicle.vehicleType.path} + '/' + ${vehicle.id}}">İncele</a>
    </div>
  </div>
</div>

<footer th:fragment="footer" class="py-4 mt-5 border-top bg-white">
  <div class="container d-flex flex-wrap justify-content-between gap-2">
    <span>© SwiftWheels · Araç kiralama</span>
    <span><i class="bi bi-geo-alt"></i> Ankara · <i class="bi bi-envelope"></i> SwiftWheels@gazi.edu.tr</span>
  </div>
</footer>

<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
