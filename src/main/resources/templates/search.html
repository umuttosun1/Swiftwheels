<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Arama')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('search')}"></nav>

<main class="container py-4">
  <h1 class="h3 fw-bold mb-1">Arama</h1>
  <p class="text-muted mb-4" th:if="${!q.isBlank()}">
    “<b th:text="${q}"></b>” için <span th:text="${results.size()}">0</span> sonuç
  </p>
  <p class="text-muted mb-4" th:if="${q.isBlank()}">Üstteki kutuya marka, model ya da renk yazın.</p>

  <div class="row g-3" th:unless="${results.isEmpty()}">
    <div class="col-sm-6 col-lg-4" th:each="v : ${results}">
      <div th:replace="~{fragments/layout :: vehicleCard(${v})}"></div>
    </div>
  </div>
  <div class="sw-card p-5 text-center text-muted" th:if="${results.isEmpty() and !q.isBlank()}">
    <i class="bi bi-search display-5"></i>
    <p class="mt-3 mb-0">Eşleşen araç bulunamadı.</p>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
