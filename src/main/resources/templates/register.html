<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Hesap aç')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('register')}"></nav>

<main class="container py-5">
  <div class="mx-auto" style="max-width: 560px">
    <div class="text-center mb-4">
      <div class="auth-brand"><i class="bi bi-lightning-charge-fill"></i> SwiftWheels</div>
      <p class="text-muted mb-0">Ücretsiz hesap aç, hemen kirala</p>
    </div>

    <div class="sw-card p-4">
      <form method="post" th:action="@{/register}" th:object="${user}" novalidate>
        <div class="row g-3">
          <div class="col-sm-6">
            <label class="form-label" for="firstName">Ad</label>
            <input id="firstName" class="form-control" th:field="*{firstName}" th:errorclass="is-invalid" required>
            <div class="invalid-feedback" th:errors="*{firstName}"></div>
          </div>
          <div class="col-sm-6">
            <label class="form-label" for="lastName">Soyad</label>
            <input id="lastName" class="form-control" th:field="*{lastName}" th:errorclass="is-invalid" required>
            <div class="invalid-feedback" th:errors="*{lastName}"></div>
          </div>
          <div class="col-12">
            <label class="form-label" for="email">E-posta</label>
            <input id="email" type="email" class="form-control" th:field="*{email}" th:errorclass="is-invalid" placeholder="ornek@mail.com" required>
            <div class="invalid-feedback" th:errors="*{email}"></div>
          </div>
          <div class="col-sm-6">
            <label class="form-label" for="birthDate">Doğum tarihi</label>
            <input id="birthDate" type="date" class="form-control" th:field="*{birthDate}" th:errorclass="is-invalid" required>
            <div class="invalid-feedback" th:errors="*{birthDate}"></div>
          </div>
          <div class="col-sm-6">
            <label class="form-label" for="phoneNumber">Telefon</label>
            <input id="phoneNumber" type="tel" class="form-control" th:field="*{phoneNumber}" th:errorclass="is-invalid" placeholder="05XXXXXXXXX" required>
            <div class="invalid-feedback" th:errors="*{phoneNumber}"></div>
          </div>
          <div class="col-12">
            <label class="form-label" for="password">Şifre</label>
            <input id="password" type="password" class="form-control" th:field="*{password}" th:errorclass="is-invalid" required minlength="8">
            <div class="form-text">En az 8 karakter.</div>
            <div class="invalid-feedback" th:errors="*{password}"></div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-4">Hesap oluştur</button>
      </form>
    </div>

    <p class="text-center mt-3 text-muted">Zaten hesabın var mı? <a th:href="@{/login}" class="fw-semibold">Giriş yap</a></p>
  </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
