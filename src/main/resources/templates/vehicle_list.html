<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${type.plural})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar(${type.path})}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
    <div>
      <h1 class="h3 fw-bold mb-1"><i th:class="'bi ' + ${type.icon} + ' text-brand'"></i> <span th:text="${type.plural}">Arabalar</span></h1>
      <p class="text-muted mb-0" th:text="${vehicles.size()} + ' araç listeleniyor'">4 araç</p>
    </div>
    <a sec:authorize="hasRole('ADMIN')" class="btn btn-primary" th:href="@{'/' + ${type.path} + '/new'}">
      <i class="bi bi-plus-lg"></i> Yeni <span th:text="${type.label.toLowerCase()}">araba</span> ekle
    </a>
  </div>

  <div class="row g-3" th:unless="${vehicles.isEmpty()}">
    <div class="col-sm-6 col-lg-4" th:each="v : ${vehicles}">
      <div th:replace="~{fragments/layout :: vehicleCard(${v})}"></div>
    </div>
  </div>

  <div class="sw-card p-5 text-center" th:if="${vehicles.isEmpty()}">
    <i th:class="'bi ' + ${type.icon} + ' display-4 text-muted'"></i>
    <p class="text-muted mt-3 mb-0">Bu kategoride henüz araç yok.</p>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
