<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Ana sayfa')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('home')}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container py-4">
  <section class="hero mb-4">
    <div class="position-relative" style="z-index:1; max-width: 560px">
      <p class="text-uppercase fw-semibold small mb-2" style="letter-spacing:.14em; color:#bdeee3">Unleash your journey</p>
      <h1 class="display-5 mb-3">Yola çıkmanın en kolay yolu</h1>
      <p class="lead mb-4">Araba, jeep ya da motor — dakikalar içinde seç, tarihini belirle, kirala.
        İstediğin zaman profilinden iade et.</p>
      <div class="d-flex flex-wrap gap-2">
        <a class="btn btn-light btn-lg fw-semibold" th:href="@{/cars}"><i class="bi bi-search me-1"></i>Araçlara göz at</a>
        <a sec:authorize="isAnonymous()" class="btn btn-outline-light btn-lg" th:href="@{/register}">Ücretsiz hesap aç</a>
        <a sec:authorize="isAuthenticated()" class="btn btn-outline-light btn-lg" th:href="@{/profile}">Kiralamalarım</a>
      </div>
    </div>
    <img class="hero-img d-none d-md-block" th:if="${hero != null}"
         th:src="@{'/vehicles/' + ${hero.id} + '/image'}" th:alt="${hero.title}">
  </section>

  <section class="row g-3 mb-5">
    <div class="col-md-4" th:each="t : ${vehicleTypes}">
      <a class="sw-card type-tile h-100" th:href="@{'/' + ${t.path}}">
        <span class="icon"><i th:class="'bi ' + ${t.icon}"></i></span>
        <span>
          <span class="d-block fw-bold" th:text="${t.plural}">Arabalar</span>
          <span class="meta" th:text="${counts.get(t)} + ' araç'">4 araç</span>
        </span>
        <i class="bi bi-chevron-right ms-auto text-muted"></i>
      </a>
    </div>
  </section>

  <section>
    <div class="d-flex justify-content-between align-items-end mb-3">
      <h2 class="h4 fw-bold mb-0">Şu an müsait</h2>
      <a th:href="@{/cars}" class="small">Tümünü gör <i class="bi bi-arrow-right"></i></a>
    </div>
    <div class="row g-3" th:unless="${featured.isEmpty()}">
      <div class="col-sm-6 col-lg-4" th:each="v : ${featured}">
        <div th:replace="~{fragments/layout :: vehicleCard(${v})}"></div>
      </div>
    </div>
    <div class="sw-card p-5 text-center text-muted" th:if="${featured.isEmpty()}">
      Şu an müsait araç yok.
    </div>
  </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
