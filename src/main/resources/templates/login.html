<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Giriş yap')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('login')}"></nav>

<main class="container py-5">
  <div class="auth-wrap mx-auto">
    <div class="text-center mb-4">
      <div class="auth-brand"><i class="bi bi-lightning-charge-fill"></i> SwiftWheels</div>
      <p class="text-muted mb-0">Hesabına giriş yap</p>
    </div>

    <div class="sw-card p-4">
      <div th:if="${param.error}" class="alert alert-danger py-2">E-posta veya şifre hatalı.</div>
      <div th:if="${param.logout}" class="alert alert-info py-2">Çıkış yaptın. Görüşmek üzere!</div>
      <div th:if="${param.registerSuccess}" class="alert alert-success py-2">Hesabın oluşturuldu, şimdi giriş yapabilirsin.</div>

      <form method="post" th:action="@{/login}">
        <div class="mb-3">
          <label class="form-label" for="email">E-posta</label>
          <input id="email" type="email" class="form-control" name="email" placeholder="ornek@mail.com" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Şifre</label>
          <input id="password" type="password" class="form-control" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Giriş yap</button>
      </form>
    </div>

    <p class="text-center mt-3 text-muted">Henüz hesabın yok mu? <a th:href="@{/register}" class="fw-semibold">Hesap aç</a></p>
  </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
