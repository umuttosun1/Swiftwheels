<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Yönetim paneli')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('admin')}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
    <h1 class="h3 fw-bold mb-0"><i class="bi bi-speedometer2 text-brand"></i> Yönetim paneli</h1>
    <div class="dropdown">
      <button class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown"><i class="bi bi-plus-lg"></i> Araç ekle</button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li th:each="t : ${vehicleTypes}"><a class="dropdown-item" th:href="@{'/' + ${t.path} + '/new'}">
          <i th:class="'bi ' + ${t.icon} + ' me-2'"></i><span th:text="${t.label}">Araba</span></a></li>
      </ul>
    </div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-6 col-lg"><div class="sw-card stat"><i class="bi bi-car-front"></i><div class="label mt-2">Araç modeli</div><div class="value" th:text="${vehicleCount}">0</div></div></div>
    <div class="col-6 col-lg"><div class="sw-card stat"><i class="bi bi-boxes"></i><div class="label mt-2">Toplam stok</div><div class="value" th:text="${totalStock}">0</div></div></div>
    <div class="col-6 col-lg"><div class="sw-card stat"><i class="bi bi-key"></i><div class="label mt-2">Kiradaki araç</div><div class="value" th:text="${activeRentals}">0</div></div></div>
    <div class="col-6 col-lg"><div class="sw-card stat"><i class="bi bi-exclamation-diamond"></i><div class="label mt-2">Gecikmede</div><div class="value" th:classappend="${overdue > 0} ? 'text-danger'" th:text="${overdue}">0</div></div></div>
    <div class="col-12 col-lg"><div class="sw-card stat"><i class="bi bi-cash-stack"></i><div class="label mt-2">Toplam ciro</div><div class="value" th:text="${#numbers.formatInteger(revenue, 1, 'POINT')} + ' ₺'">0 ₺</div></div></div>
  </div>

  <ul class="nav nav-tabs mb-3" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#rentals" type="button">Kiralamalar <span class="badge bg-light text-dark" th:text="${rentals.size()}">0</span></button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#vehicles" type="button">Araçlar <span class="badge bg-light text-dark" th:text="${vehicles.size()}">0</span></button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#users" type="button">Kullanıcılar <span class="badge bg-light text-dark" th:text="${users.size()}">0</span></button></li>
  </ul>

  <div class="tab-content">
    <div class="tab-pane fade show active" id="rentals">
      <div class="sw-card overflow-hidden">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead><tr><th>#</th><th>Araç</th><th>Müşteri</th><th>Tarih</th><th class="text-end">Tutar</th><th>Durum</th><th></th></tr></thead>
            <tbody>
              <tr th:if="${rentals.isEmpty()}"><td colspan="7" class="text-center text-muted py-4">Henüz kiralama yok.</td></tr>
              <tr th:each="r : ${rentals}">
                <td class="text-muted" th:text="${r.id}">1</td>
                <td><a th:href="@{'/' + ${r.vehicle.vehicleType.path} + '/' + ${r.vehicle.id}}" th:text="${r.vehicle.title}">Model</a></td>
                <td><div th:text="${r.user.fullName}">Ad</div><div class="meta" th:text="${r.user.email}">mail</div></td>
                <td class="small"><span th:text="${#temporals.format(r.startDate, 'dd.MM.yyyy')}"></span> → <span th:text="${#temporals.format(r.endDate, 'dd.MM.yyyy')}"></span></td>
                <td class="text-end fw-semibold" th:text="${#numbers.formatInteger(r.totalPrice, 1, 'POINT')} + ' ₺'">0</td>
                <td>
                  <span th:if="${r.overdue}" class="badge bg-danger">Gecikmede</span>
                  <span th:if="${r.active and !r.overdue}" class="badge bg-success">Kirada</span>
                  <span th:if="${r.status.name() == 'RETURNED'}" class="badge bg-secondary">İade edildi</span>
                </td>
                <td class="text-end">
                  <form th:if="${r.active}" th:action="@{'/rentals/' + ${r.id} + '/return'}" method="post" onsubmit="return confirm('İade alındı olarak işaretlensin mi?')">
                    <button class="btn btn-sm btn-outline-primary">İade al</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="tab-pane fade" id="vehicles">
      <div class="sw-card overflow-hidden">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead><tr><th></th><th>Araç</th><th>Tür</th><th class="text-end">Günlük</th><th class="text-end">Stok</th><th></th></tr></thead>
            <tbody>
              <tr th:each="v : ${vehicles}">
                <td><img th:if="${v.hasImage()}" class="thumb" th:src="@{'/vehicles/' + ${v.id} + '/image'}" alt=""></td>
                <td><a th:href="@{'/' + ${v.vehicleType.path} + '/' + ${v.id}}" class="fw-semibold" th:text="${v.title}">Model</a><div class="meta" th:text="${v.year} + ' · ' + ${v.color}"></div></td>
                <td th:text="${v.vehicleType.label}">Araba</td>
                <td class="text-end" th:text="${#numbers.formatInteger(v.price, 1, 'POINT')} + ' ₺'">0</td>
                <td class="text-end"><span class="badge rounded-pill" th:classappend="${v.stock > 0} ? 'badge-stock' : 'badge-out'" th:text="${v.stock}">0</span></td>
                <td class="text-end"><a class="btn btn-sm btn-light" th:href="@{'/' + ${v.vehicleType.path} + '/' + ${v.id} + '/edit'}"><i class="bi bi-pencil"></i></a></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="tab-pane fade" id="users">
      <div class="sw-card overflow-hidden">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead><tr><th>#</th><th>Ad</th><th>E-posta</th><th>Telefon</th><th>Rol</th><th></th></tr></thead>
            <tbody>
              <tr th:each="u : ${users}">
                <td class="text-muted" th:text="${u.id}">1</td>
                <td th:text="${u.fullName}">Ad</td>
                <td th:text="${u.email}">mail</td>
                <td th:text="${u.phoneNumber}">05..</td>
                <td><span th:if="${u.admin}" class="badge bg-primary">Admin</span><span th:unless="${u.admin}" class="badge bg-light text-dark">Kullanıcı</span></td>
                <td class="text-end">
                  <form th:action="@{'/admin/users/' + ${u.id} + '/admin'}" method="post" class="d-inline">
                    <input type="hidden" name="admin" th:value="${!u.admin}">
                    <button class="btn btn-sm" th:classappend="${u.admin} ? 'btn-outline-danger' : 'btn-outline-primary'"
                            th:text="${u.admin} ? 'Adminliği kaldır' : 'Admin yap'">Admin yap</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
  // #users / #vehicles bağlantıları doğru sekmeyi açsın
  const tab = location.hash && document.querySelector(`[data-bs-target="${location.hash}"]`);
  if (tab) bootstrap.Tab.getOrCreateInstance(tab).show();
</script>
</body>
</html>
