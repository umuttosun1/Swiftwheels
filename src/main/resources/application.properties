spring.application.name=Swiftwheels
server.port=${PORT:8080}

# --- Veritabanı -------------------------------------------------------------
# Şifreler koda yazılmaz: ortam değişkenleriyle verin (DB_URL, DB_USER, DB_PASSWORD).
# Varsayılanlar yerel PostgreSQL içindir (scripts/setup-database.ps1 bunları oluşturur).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/swiftwheels_web}
spring.datasource.username=${DB_USER:swiftwheels}
spring.datasource.password=${DB_PASSWORD:swiftwheels}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Uygulama ---------------------------------------------------------------
# İlk açılışta bu admin hesabı yoksa oluşturulur. Gerçek kullanımda mutlaka değiştirin.
app.admin.email=${ADMIN_EMAIL:admin@swiftwheels.com}
app.admin.password=${ADMIN_PASSWORD:Admin123!}
# Veritabanında hiç araç yoksa örnek araçlar eklenir.
app.seed-demo-data=${SEED_DEMO_DATA:true}
# Kasko + sigorta paketinin sabit ücreti (₺)
app.rental.insurance-fee=250

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
